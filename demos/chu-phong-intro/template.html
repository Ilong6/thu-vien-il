<div class="stage">
  <svg id="art" viewBox="0 0 440 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Màn đội hình: thẻ chủ phòng được rọi sáng, huy hiệu chìa khoá lớn lên từ avatar kèm chữ Chủ phòng uy tín, rồi thu về avatar; viền vàng chạy quanh thẻ và nền trang trí hiện ra">
    <defs>
      {{BADGE_DEFS}}
      <clipPath id="cardClip"><rect x="1" y="1" width="391" height="54" rx="8"/></clipPath>
    </defs>
    <image href="{{BASE}}" x="0" y="0" width="440" height="720"/>

    <!-- nền trang trí thẻ chủ phòng (Figma BG), nằm dưới nội dung thẻ -->
    <g id="deco" transform="translate(25 201)" opacity="0">
      <g clip-path="url(#cardClip)">
        <g id="flames">
          <path id="fBig" opacity="0.15" d="M245.049 1.2578C189.249 -0.0420694 135.775 19.501 116.5 19.501C133.999 2.00098 60.8891 -0.920012 36.9995 10.5011C16.4995 20.3017 10.9995 47.501 30.4995 40.001C22.9995 58.501 1.99955 53.0013 -14.5004 53.0013C-34.2675 53.0013 -6.0004 14.0796 -6.0004 -5.6875L245.049 1.2578C245.699 1.27294 246.349 1.2909 246.999 1.31175L245.049 1.2578Z" fill="#FFE600"/>
          <path id="fTop" d="M391.5 22.501C391.5 15.0725 378.5 -0.499059 366 14.0009C372.156 3.74151 364.115 1.43568 347.971 1.00293H321C331.32 1.00293 340.51 0.802974 347.971 1.00293H392L391.5 22.501Z" fill="#FFE600"/>
          <path id="fBot" d="M334 42.5C350 46.5 340 55 368 55H268C307.429 54.7764 302 49 314 48C303 60.5 349 52.0148 334 42.5Z" fill="#FFE600"/>
        </g>
        <g id="corners">
          <path id="cornerL" d="M28 1C13.0883 1 1 13.0883 1 28C1 42.9117 13.0883 55 28 55H9C4.58172 55 1 51.4183 1 47V9C1 4.58172 4.58172 1 9 1H28Z" fill="#FFE600" opacity="0"/>
          <path id="cornerR" d="M384 1C388.418 1 392 4.58172 392 9V47C392 51.4183 388.418 55 384 55H365C379.912 55 392 42.9117 392 28C392 13.0883 379.912 1 365 1H384Z" fill="#FFE600" opacity="0"/>
        </g>
        <!-- phản hồi khi huy hiệu đáp: một gợn sáng loang ra từ avatar -->
        <circle id="pulse" cx="40" cy="38" r="0" fill="#fff" opacity="0"/>
      </g>
      <rect id="border" x="0.5" y="0.5" width="392" height="55" rx="8.5" stroke="#FFE600" pathLength="1" stroke-dasharray="1 1"/>
      <!-- vệt sáng trắng solid mỗi 2.5s, chỉ chạy trên phần viền/mảng vàng (không qua ruột thẻ) -->
      <mask id="yellowOnly" maskUnits="userSpaceOnUse" x="-10" y="-10" width="413" height="76" style="mask-type:alpha">
        <use href="#corners"/><use href="#fTop"/><use href="#fBot"/><use href="#border"/>
      </mask>
      <g mask="url(#yellowOnly)"><rect id="cardSheen" x="-14" y="-40" width="28" height="140" fill="#fff" fill-opacity=".75" visibility="hidden"/></g>
    </g>
    <image href="{{CONTENT}}" x="26" y="202" width="391" height="54"/>
    <image id="small" href="{{SMALL}}" x="53" y="227" width="24" height="24" opacity="0"/>

    <!-- lớp phủ tối chừa lại thẻ chủ phòng: huy hiệu là của người này -->
    <mask id="spot" maskUnits="userSpaceOnUse" x="0" y="0" width="440" height="720">
      <rect width="440" height="720" fill="#fff"/>
      <rect x="22" y="198" width="399" height="62" rx="11" fill="#000"/>
    </mask>
    <rect id="overlay" x="0" y="0" width="440" height="720" fill="#0A0A0A" opacity="0" mask="url(#spot)"/>
    <!-- khi huy hiệu lớn lên, thẻ cũng mờ đi để mắt dồn vào huy hiệu + chữ -->
    <rect id="cardDim" x="22" y="198" width="399" height="62" rx="11" fill="#0A0A0A" opacity="0"/>
    <!-- chữ "Chủ phòng uy tín": nằm sau huy hiệu, trượt ra từ hông phải; phần bên trái tâm huy hiệu bị cắt -->
    <clipPath id="pillReveal"><rect x="66" y="150" width="374" height="160"/></clipPath>
    <g clip-path="url(#pillReveal)"><g id="pill" opacity="0">
      <rect x="-50" width="100" height="43" rx="21.5" fill="#FFE600"/>
      {{PILL}}
      <clipPath id="pillClip"><rect x="-50" width="231" height="43" rx="21.5"/></clipPath>
      <g clip-path="url(#pillClip)"><rect id="pillSheen" x="-9" y="-30" width="18" height="100" fill="#fff" fill-opacity=".85" visibility="hidden"/></g>
    </g></g>
    <!-- huy hiệu chìa khoá lớn (160×160, tâm 220.08 343.6) -->
    <g id="badge" opacity="0"><g transform="translate(140.08 263.6)">{{BADGE}}</g></g>
  </svg>
</div>
<button id="replay" type="button">↻ Phát lại</button>
