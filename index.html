<script type="text/plain" id="src-go-bua-css">
html,body{margin:0;height:100%}
body{background:#2A2A2E;overflow:hidden;font:500 13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.stage{position:fixed;inset:0;display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none}
.art{width:min(80vmin,560px);height:auto;overflow:visible}
.art g{transform-box:view-box}

/* toolbar: one hammer button at the top */
.tool{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;
  padding:8px 14px 8px 10px;border-radius:999px;border:1px solid #ffffff22;background:#3A3A40;color:#EDEDED;
  font:inherit;cursor:pointer;transition:background .15s,border-color .15s}
.tool svg{width:40px;height:16px}
.tool:hover{background:#45454C}
.tool[aria-pressed="true"]{background:#F05A22;border-color:#F05A22;color:#fff}
.tool:focus-visible{outline:2px solid #FBBF24;outline-offset:2px}

/* hammer that replaces the cursor; positioned and swung by script.js */
.armed,.armed *{cursor:none!important}
.hammer{position:fixed;left:0;top:0;pointer-events:none;display:none;z-index:5}
.armed .hammer{display:block}
.hammer svg{display:block;width:100%;height:100%;filter:drop-shadow(0 4px 3px #0005)}

.hint{position:absolute;bottom:14px;left:0;right:0;margin:0;text-align:center;color:#ffffff70}
</script>
<script type="text/plain" id="src-go-bua-js">
/* Gõ búa Navi: Navi follows the cursor with its face, curious and smiling.
   The hammer button turns the cursor into a hammer; hitting Navi squashes it,
   it cries for a moment, then laughs it off. Esc puts the hammer down. */
(function () {
  var svg = document.getElementById('art');
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };

  // getBBox reads as empty while the page sits in a hidden frame, so wait for a real size
  function measurable() {
    try { return svg.querySelector('[data-eye]').getBBox().width > 0; } catch (e) { return false; }
  }
  (function boot() { if (measurable()) main(); else setTimeout(boot, 100); })();

  function main() {

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function prog(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function sstep(a, b, v) { return smooth(clamp((v - a) / (b - a), 0, 1)); }
  function easeIn(t) { return t * t; }
  // damped spring from `from` to `to`, p in 0..1
  function settle(from, to, p) { return to + (from - to) * Math.cos(p * Math.PI * 2.5) * Math.pow(1 - p, 2.2); }
  // eases v toward target at `rate` per second, frame-rate independent
  function follow(v, target, rate, dt) { return lerp(v, target, 1 - Math.exp(-rate * dt)); }

  var stage = $('stage'), tool = $('tool'), hammer = $('hammer'), hint = $('hint');
  var navi = $('navi'), shadow = $('shadow'), back = $('back'), screen = $('screen'),
      faceG = $('face'), eyesG = $('eyes'), shut = $('shut'), tears = $('tears'), fx = $('fx');
  // body parts used to decide whether the hammer landed on Navi
  var hitParts = [navi.querySelector('#torso > path'), screen.firstElementChild].concat(
    [].slice.call(navi.firstElementChild.querySelectorAll('path')));

  function centre(els) {
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    els.forEach(function (e) {
      var b = e.getBBox();
      x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height);
    });
    return { x: (x0 + x1) / 2, y: (y0 + y1) / 2 };
  }

  /* ---------- puppet: the torso outlines are bent point by point ----------
     Feet stay planted. The side flaps (Navi's arms) swing on their shoulders,
     the body turns toward where the face looks and bobs up and down,
     squashing toward the hips. The spine bend is left at zero so the body
     never sways sideways. */
  var NUM = /-?(?:\d+\.?\d*|\.\d+)(?:e-?\d+)?/g;
  var paths = [].map.call(svg.querySelectorAll('[data-pts]'), function (el) {
    var d = el.getAttribute('d');
    return { el: el, nums: d.match(NUM).map(Number), parts: d.split(NUM) };
  });

  var HIP = 156, SHOULDER_L = [54, 76], SHOULDER_R = [146, 76];
  var rig = { bend: 0, bob: 0, armL: 0, armR: 0, turn: 0, nod: 0 };

  /* the folder screen is a thick slab: its dark side is the screen outline
     swept back along the depth direction, drawn as stacked copies */
  var face0 = screen.firstElementChild, SLICES = 12, slices = [];
  for (var i = 0; i < SLICES; i++) {
    var sl = document.createElementNS(NS, 'path');
    sl.setAttribute('fill', '#262626'); sl.setAttribute('stroke', '#262626'); sl.setAttribute('stroke-width', '.8');
    back.appendChild(sl); slices.push(sl);
  }
  function extrude(ox, oy, dx, dy) {
    var d = face0.getAttribute('d');
    slices.forEach(function (sl, i) {
      var t = (i + 1) / SLICES;
      sl.setAttribute('d', d);
      sl.setAttribute('transform', 'translate(' + (ox + dx * t) + ' ' + (oy + dy * t) + ')');
    });
  }

  function rot(x, y, cx, cy, deg) {
    var a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), dx = x - cx, dy = y - cy;
    return [cx + dx * c - dy * s, cy + dx * s + dy * c];
  }
  function warp(x, y) {
    var h = clamp((HIP - y) / 136, 0, 1), p;
    // arms first, as rigid flaps weighted toward their outer, lower edge
    var wl = sstep(68, 24, x) * sstep(55, 115, y), wr = sstep(132, 176, x) * sstep(55, 115, y);
    if (wl) { p = rot(x, y, SHOULDER_L[0], SHOULDER_L[1], rig.armL * wl); x = p[0]; y = p[1]; }
    if (wr) { p = rot(x, y, SHOULDER_R[0], SHOULDER_R[1], -rig.armR * wr); x = p[0]; y = p[1]; }
    // turning toward the cursor: treat the body as a round cone, so the front
    // (middle) slides toward the look while the silhouette edges stay put and the
    // near side bunches up; nodding tips the top forward a little
    // perspective: the side Navi turns toward shrinks a touch, the far side swells a touch
    var dx = x - 100;
    x = 100 + dx * (1 - 0.06 * rig.turn * clamp(dx / 90, -1, 1));
    var hw = lerp(10, 92, clamp((y - 20) / 130, 0, 1)), u = clamp((x - 100) / hw, -1, 1);
    x += rig.turn * 6 * Math.cos(u * Math.PI / 2);
    y += rig.nod * 3 * h * h;
    // knee bob: shorter and a touch wider
    y = HIP - (HIP - y) * (1 - rig.bob);
    x = 100 + (x - 100) * (1 + rig.bob * 0.5);
    // spine: the higher the point, the further it bends
    return rot(x, y, 100, HIP, rig.bend * Math.pow(h, 1.4));
  }
  function deform() {
    paths.forEach(function (p) {
      var n = p.nums, out = p.parts[0];
      for (var i = 0; i < n.length; i += 2) {
        var q = warp(n[i], n[i + 1]);
        out += q[0].toFixed(2) + p.parts[i + 1] + q[1].toFixed(2) + p.parts[i + 2];
      }
      p.el.setAttribute('d', out);
    });
  }

  /* ---------- face: one pair of eyes that stays, the mouth changes ---------- */
  var eyes = [].map.call(svg.querySelectorAll('[data-eye]'), function (e) {
    var c = centre([e]);
    return { el: e, x: c.x, y: c.y };
  });
  var mouths = {};
  [].forEach.call(svg.querySelectorAll('[data-mouth]'), function (g) {
    var c = centre([g]);
    mouths[g.getAttribute('data-mouth')] = { el: g, x: c.x, y: c.y, w: 0, base: g.getAttribute('transform') || '' };
  });
  mouths.curious.w = 1;
  var eye = { open: 1, lift: 0, shut: 0 }, eyesBase = eyesG.getAttribute('transform') || '';
  var nextBlink = performance.now() + 2500, blinkAt = -1e9, blinks = 1;

  // the old mouth closes toward its centre first, then the new one opens with a little pop
  function mouthTo(name, dt) {
    var others = 0;
    for (var k in mouths) if (k !== name) others = Math.max(others, mouths[k].w);
    for (k in mouths) {
      var m = mouths[k];
      m.w = k === name ? (others < 0.2 ? Math.min(1, m.w + dt / 0.17) : m.w)
                       : Math.max(0, m.w - dt / 0.11);
      var grow = k === name && m.w < 1, s;
      if (!m.w) { m.el.style.visibility = 'hidden'; continue; }
      s = grow ? 1 + Math.sin(m.w * Math.PI) * 0.12 - (1 - m.w) * 0.8 : 0.2 + 0.8 * m.w;
      m.el.style.visibility = '';
      m.el.style.opacity = Math.min(1, m.w * 2.5);
      m.el.setAttribute('transform', m.base + ' translate(' + m.x + ' ' + m.y + ') scale(' + Math.max(0.05, s) + ') translate(' + -m.x + ' ' + -m.y + ')');
    }
  }

  /* ---------- pointer & hammer ---------- */
  var ptr = { x: innerWidth / 2, y: innerHeight / 2, in: false };
  var look = { x: 0, y: 0 };
  var armed = false, swingAt = -1e9, struck = true;
  var REST = 30, SWING = 80, BACK = 260;

  function arm(on) {
    armed = on;
    stage.classList.toggle('armed', on);
    tool.setAttribute('aria-pressed', on ? 'true' : 'false');
    hint.textContent = on ? 'Gõ vào Navi · Esc để bỏ búa' : 'Bấm nút búa rồi gõ vào Navi · Esc để bỏ búa';
  }
  tool.addEventListener('click', function (e) { e.stopPropagation(); arm(!armed); });
  addEventListener('keydown', function (e) { if (e.key === 'Escape') arm(false); });

  addEventListener('pointermove', function (e) { ptr.x = e.clientX; ptr.y = e.clientY; ptr.in = true; });
  document.addEventListener('pointerleave', function () { ptr.in = false; });
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.tool')) return;
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.in = true;
    if (armed) { swingAt = performance.now(); struck = false; }
    else {
      var f = onFoot(e.clientX, e.clientY);
      if (f) { kick(f, performance.now()); play('laugh', performance.now()); }   // a poke on a foot tickles: it jumps and giggles
      else if (onNavi(e.clientX, e.clientY)) play('laugh', performance.now());   // a poke makes it giggle
    }
  });

  /* feet: a poke makes that foot jerk up, curl its toes, hold, then rest it back on the ground */
  var feetEls = { L: [], R: [] }, footAt = { L: -1e9, R: -1e9 };
  [].forEach.call(svg.querySelectorAll('[data-foot]'), function (e) { feetEls[e.getAttribute('data-foot')].push(e); });
  var FOOT_PIVOT = { L: [96, 160], R: [104, 160] };
  function inFill(p, cx, cy) {
    var m = p.getScreenCTM();
    if (!m) return false;
    var pt = new DOMPoint(cx, cy).matrixTransform(m.inverse());
    return p.isPointInFill(pt) || p.isPointInStroke(pt);
  }
  function onFoot(cx, cy) {
    for (var s in feetEls) if (feetEls[s].some(function (p) { return inFill(p, cx, cy); })) return s;
    return null;
  }
  function kick(side, now) { footAt[side] = now; }
  function footCurve(t) {
    if (t < 0 || t > 650) return 0;
    if (t < 90) return 1 - Math.pow(1 - t / 90, 3);               // jerks up fast
    if (t < 320) return 1;                                        // holds it up
    return 1 - smooth((t - 320) / 330);                           // lowers it and rests it on the ground
  }

  function onNavi(cx, cy) {
    return hitParts.some(function (p) {
      var m = p.getScreenCTM();
      if (!m) return false;
      var pt = new DOMPoint(cx, cy).matrixTransform(m.inverse());
      return p.isPointInFill(pt) || (p.isPointInStroke && p.isPointInStroke(pt));
    });
  }
  function toSvg(cx, cy) {
    return new DOMPoint(cx, cy).matrixTransform(svg.getScreenCTM().inverse());
  }

  function placeHammer(now) {
    var sc = svg.getBoundingClientRect().width / 200 * 0.95;
    // hammer drawing: head bottom-centre (18,47), grip (112,23), viewBox starts at -1
    var t = now - swingAt, a = REST;
    if (t < SWING) a = lerp(REST, -6, easeIn(t / SWING));
    else if (t < SWING + BACK) a = settle(-6, REST, (t - SWING) / BACK);
    var s = hammer.style;
    s.width = 125 * sc + 'px'; s.height = 49 * sc + 'px';
    s.transformOrigin = 113 * sc + 'px ' + 24 * sc + 'px';
    s.transform = 'translate(' + (ptr.x - 19 * sc) + 'px,' + (ptr.y - 48 * sc) + 'px) rotate(' + a + 'deg)';
    if (!struck && t >= SWING) { struck = true; if (onNavi(ptr.x, ptr.y)) hit(ptr.x, ptr.y); }
  }

  /* ---------- moods ----------
     Curious is home. Now and then Navi smiles or laughs for a moment; a hammer
     blow makes it cry, and it laughs it off straight after. */
  var mood = 'curious', moodAt = 0, moodLen = 0, nextMood = performance.now() + 6000;
  var CRY = 1500, LEN = { smile: 2600, laugh: 1500, cry: CRY };
  var hitAt = -1e9, power = 1;
  var drops = [], lastDrop = 0;

  function play(m, now) { mood = m; moodAt = now; moodLen = LEN[m]; }

  function hit(cx, cy) {
    var now = performance.now();
    power = now - hitAt < CRY ? 0.75 : 1;     // a second blow while crying squashes a bit less
    hitAt = now;
    play('cry', now);
    var f = onFoot(cx, cy);
    if (f) kick(f, now);
    var p = toSvg(cx, cy);
    burst(p.x, p.y);
  }

  function burst(x, y) {
    var g = document.createElementNS(NS, 'g');
    for (var i = 0; i < 7; i++) {
      var a = -Math.PI / 2 + (i - 3) * 0.42, l = document.createElementNS(NS, 'path');
      l.setAttribute('d', 'M' + Math.cos(a) * 9 + ' ' + Math.sin(a) * 9 + 'L' + Math.cos(a) * 17 + ' ' + Math.sin(a) * 17);
      l.setAttribute('stroke', i % 2 ? '#FBBF24' : '#FEF08A');
      l.setAttribute('stroke-width', '2.4'); l.setAttribute('stroke-linecap', 'round');
      g.appendChild(l);
    }
    var star = document.createElementNS(NS, 'path');
    star.setAttribute('d', 'M0 -7L2 -2L7 -2L3 1.5L4.5 6.5L0 3.5L-4.5 6.5L-3 1.5L-7 -2L-2 -2Z');
    star.setAttribute('fill', '#FEF08A'); star.setAttribute('stroke', '#0A0A0A'); star.setAttribute('stroke-width', '.8');
    star.setAttribute('stroke-linejoin', 'round');
    g.appendChild(star);
    fx.appendChild(g);
    g.animate([{ transform: 'translate(' + x + 'px,' + y + 'px) scale(.4)', opacity: 1 },
               { transform: 'translate(' + x + 'px,' + y + 'px) scale(1.25)', opacity: 1, offset: .35 },
               { transform: 'translate(' + x + 'px,' + y + 'px) scale(1.4)', opacity: 0 }],
              { duration: 380, easing: 'ease-out' }).onfinish = function () { g.remove(); };
  }

  var last = performance.now();
  function tick(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (armed) placeHammer(now);

    if (mood !== 'curious' && now - moodAt > moodLen) {
      if (mood === 'cry') play('laugh', now);                        // laughs it off right away
      else { mood = 'curious'; nextMood = now + 7000 + Math.random() * 6000; }
    }
    if (mood === 'curious' && now > nextMood) play(Math.random() < 0.6 ? 'smile' : 'laugh', now);
    var t = now - moodAt, crying = mood === 'cry';

    // where Navi looks: from the middle of its face screen toward the cursor (or the hammer head)
    var r = screen.getBoundingClientRect(), w = svg.getBoundingClientRect().width;
    var tx = 0, ty = 0;
    if (ptr.in && !crying) {
      var dx = ptr.x - (r.left + r.width / 2), dy = ptr.y - (r.top + r.height / 2);
      var d = Math.hypot(dx, dy), k = Math.min(1, d / (w * 0.6)) / (d || 1);
      tx = dx * k; ty = dy * k;
    }
    if (crying) ty = 0.3;                                            // head hangs a little
    look.x = follow(look.x, tx, crying ? 10 : 5, dt); look.y = follow(look.y, ty, crying ? 10 : 5, dt);
    var lx = look.x, ly = look.y;

    /* body: only a soft up-and-down bob; the arms swing left-right very slightly */
    var ph = now / 1600 * Math.PI * 2;                               // one bob every 1.6 s
    var bend = 0;
    var bob = 0.018 * (1 - Math.cos(ph)) / 2;
    var swing = Math.sin(now / 3200 * Math.PI * 2 - 0.6) * 1.2;      // both arms the same way, slower than the bob
    var armL = swing + bob * 20, armR = -swing + bob * 20;           // arms lift a touch as the body dips
    if (mood === 'laugh') {                                          // arms flap with each chuckle
      var e = Math.sin(prog(t, 0, moodLen) * Math.PI);
      var flap = Math.abs(Math.sin(t / 1000 * Math.PI * 5)) * 4 * e;
      armL += flap; armR += flap; bob += Math.abs(Math.sin(t / 1000 * Math.PI * 5)) * 0.025 * e;
    } else if (mood === 'smile') {
      var u = Math.sin(prog(t, 0, moodLen) * Math.PI);
      armL += 2 * u; armR += 2 * u;
    } else if (crying) {                                             // arms droop in and shiver
      var c = prog(t, 0, 200) * (1 - prog(t, CRY - 300, CRY));
      armL = lerp(armL, -4 + Math.sin(t / 55) * 1.2, c); armR = lerp(armR, -4 + Math.sin(t / 55 + 1) * 1.2, c);
      bob = lerp(bob, 0.03 + Math.sin(t / 85) * 0.012, c);          // sobbing
    }
    var startle = 0;
    for (var side in feetEls) {
      var c = footCurve(now - footAt[side]), fp = FOOT_PIVOT[side];
      startle = Math.max(startle, Math.max(0, c));
      var tr = 'translate(0 ' + (-5 * c) + ') rotate(' + (side === 'L' ? 16 : -16) * c + ' ' + fp[0] + ' ' + fp[1] + ')';
      feetEls[side].forEach(function (e) { e.setAttribute('transform', tr); });
    }
    bob -= 0.03 * startle;                                           // the body jolts up with it
    rig.bend = follow(rig.bend, bend, 8, dt); rig.bob = bob; rig.turn = lx; rig.nod = ly;
    rig.armL = follow(rig.armL, armL, 12, dt); rig.armR = follow(rig.armR, armR, 12, dt);
    deform();

    // the blow squashes the whole of Navi into the floor, then it springs back
    var sx = 1, sy = 1, tHit = now - hitAt;
    if (tHit < 900) {
      var squash = 0.3 * power;
      sy = tHit < 70 ? lerp(1, 1 - squash, tHit / 70) : settle(1 - squash, 1, prog(tHit, 70, 900));
      sx = 1 + (1 - sy) * 0.7;
    }
    navi.setAttribute('transform', 'translate(100 178) scale(' + sx + ' ' + sy + ') translate(-100 -178)');
    shadow.setAttribute('transform', 'translate(100 178) scale(' + sx + ' 1) translate(-100 -178)');

    // the screen slides with parallax (screen < face, as drawn in Figma). Its depth
    // points down-right at rest; turning toward the cursor swings the depth the
    // other way, so looking down the thickness thins below and shows over the top
    var sx0 = 3 * lx, sy0 = 5 * ly;                               // on top of the body's own turn
    screen.setAttribute('transform', 'translate(' + sx0 + ' ' + sy0 + ')');
    extrude(sx0, sy0, 2.5 - 5.5 * lx, 5.5 - 9 * ly);
    // the face rides on the bent body like a pinned layer
    var p0 = warp(100, 95), p1 = warp(112, 95), ang = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]) * 180 / Math.PI;
    faceG.setAttribute('transform', 'translate(' + p0[0] + ' ' + p0[1] + ') rotate(' + ang + ') translate(-100 -95) translate(' + 11 * lx + ' ' + 11 * ly + ')');
    eyesG.setAttribute('transform', eyesBase + ' translate(' + 1.5 * lx + ' ' + 1.2 * ly + ')');   // pupils lead the face a hair

    /* eyes: always the same pair; they blink, squint when smiling, squeeze shut when crying */
    if (now > nextBlink) { blinkAt = now; blinks = Math.random() < 0.25 ? 2 : 1; nextBlink = now + 2800 + Math.random() * 2600; }
    var bt = now - blinkAt, blink = 1;
    if (bt < 150 * blinks) blink = 1 - Math.sin((bt % 150) / 150 * Math.PI) * 0.92;
    var open = mood === 'laugh' ? 0.55 : mood === 'smile' ? 0.8 : crying ? 0.08 : 1;
    var lift = mood === 'laugh' ? -1.2 : mood === 'smile' ? -0.6 : 0;
    eye.open = follow(eye.open, open, crying ? 30 : 10, dt);
    eye.lift = follow(eye.lift, lift, 10, dt);
    eye.shut = follow(eye.shut, crying ? 1 : 0, crying ? 25 : 12, dt);
    var b = Math.min(eye.open, blink) * (1 + 0.22 * startle);      // eyes pop wide when a foot jumps
    eyes.forEach(function (e) {
      e.el.setAttribute('transform', 'translate(' + e.x + ' ' + (e.y + eye.lift) + ') scale(1 ' + b + ') translate(' + -e.x + ' ' + -e.y + ')');
    });
    eyesG.style.opacity = 1 - eye.shut;
    shut.style.opacity = eye.shut;
    shut.style.visibility = eye.shut > 0.01 ? '' : 'hidden';

    /* mouth: curious "o" breathes a little; other moods swap it */
    mouthTo(mood === 'laugh' ? 'happy' : mood, dt);
    var mc = mouths.curious;
    if (mc.w === 1) {
      var ms = 1 + Math.sin(now / 600) * 0.06;
      mc.el.setAttribute('transform', mc.base + ' translate(' + mc.x + ' ' + mc.y + ') scale(' + (1.5 - ms / 2) + ' ' + ms + ') translate(' + -mc.x + ' ' + -mc.y + ')');
    }

    if (crying && now - lastDrop > 120 && t > 120) { lastDrop = now; dropTear(); }
    updateTears(now, dt);
    requestAnimationFrame(tick);
  }

  // tears roll from the outer corners of the shut eyes
  var side = 0;
  function dropTear() {
    side ^= 1;
    var x = (side ? 75 : 124) + (Math.random() - 0.5) * 2, y = 95;
    var e = document.createElementNS(NS, 'path');
    e.setAttribute('fill', '#BFDBFE'); e.setAttribute('stroke', '#0A0A0A'); e.setAttribute('stroke-width', '.5');
    e.setAttribute('d', 'M0 -2.6C1.4 -0.6 1.9 0.4 1.9 1.1A1.9 1.9 0 0 1 -1.9 1.1C-1.9 0.4 -1.4 -0.6 0 -2.6Z');
    tears.appendChild(e);
    drops.push({ el: e, x: x, y: y, vx: (side ? -1 : 1) * (6 + Math.random() * 6), vy: -10, born: performance.now() });
  }
  function updateTears(now, dt) {
    drops = drops.filter(function (d) {
      d.vy += 160 * dt; d.x += d.vx * dt; d.y += d.vy * dt;
      var age = (now - d.born) / 700;
      if (age >= 1) { d.el.remove(); return false; }
      d.el.setAttribute('transform', 'translate(' + d.x + ' ' + d.y + ')');
      d.el.setAttribute('opacity', String(1 - age * age));
      return true;
    });
  }

  requestAnimationFrame(tick);
  }
})();
</script>

<script type="text/plain" id="src-du-nguoi-css">
html,body{height:100%;margin:0}
body{background:#0B0B0C;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.stage{width:min(100%,440px,calc((100vh - 32px) * 440 / 670));aspect-ratio:440/670;border-radius:14px;overflow:hidden;background:#000}
.stage svg{display:block;width:100%;height:100%}
</script>
<script type="text/plain" id="src-du-nguoi-js">
(function () {
  var TAU = Math.PI * 2, sin = Math.sin, cos = Math.cos;
  var NS = "http://www.w3.org/2000/svg";
  function smooth(u) { return u * u * (3 - 2 * u); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  // nội suy mượt qua các mốc [thời điểm, giá trị]
  function key(t, ks) {
    if (t <= ks[0][0]) return ks[0][1];
    for (var k = 1; k < ks.length; k++) if (t <= ks[k][0]) {
      var a = ks[k - 1], b = ks[k];
      return a[1] + (b[1] - a[1]) * smooth((t - a[0]) / (b[0] - a[0]));
    }
    return ks[ks.length - 1][1];
  }
  function rot(x, y, cx, cy, deg) {
    var r = deg * Math.PI / 180, c = cos(r), s = sin(r), dx = x - cx, dy = y - cy;
    return [cx + dx * c - dy * s, cy + dx * s + dy * c];
  }

  /* ---------- đọc path thành đoạn tuyệt đối để uốn từng điểm (giống rig Navi kết bạn) ---------- */
  function parse(d) {
    var toks = d.match(/[a-zA-Z]|-?(?:\d+\.?\d*|\.\d+)(?:e-?\d+)?/g), i = 0, cmd = "", out = [];
    var x = 0, y = 0, sx = 0, sy = 0;
    function n() { return parseFloat(toks[i++]); }
    while (i < toks.length) {
      if (/[a-zA-Z]/.test(toks[i])) cmd = toks[i++];
      var rel = cmd === cmd.toLowerCase(), C = cmd.toUpperCase();
      if (C === "Z") { out.push({ c: "Z", p: [] }); x = sx; y = sy; continue; }
      if (C === "M" || C === "L") {
        var px = n() + (rel ? x : 0), py = n() + (rel ? y : 0);
        out.push({ c: C, p: [[px, py]] }); x = px; y = py;
        if (C === "M") { sx = x; sy = y; cmd = rel ? "l" : "L"; }
      } else if (C === "H") { x = n() + (rel ? x : 0); out.push({ c: "L", p: [[x, y]] }); }
      else if (C === "V") { y = n() + (rel ? y : 0); out.push({ c: "L", p: [[x, y]] }); }
      else if (C === "C") {
        var a = [n(), n(), n(), n(), n(), n()];
        if (rel) { a[0] += x; a[1] += y; a[2] += x; a[3] += y; a[4] += x; a[5] += y; }
        out.push({ c: "C", p: [[a[0], a[1]], [a[2], a[3]], [a[4], a[5]]] }); x = a[4]; y = a[5];
      } else { throw new Error("Unsupported path command " + cmd); }
    }
    return out;
  }
  function write(segs, f) {
    var s = "";
    for (var k = 0; k < segs.length; k++) {
      var g = segs[k]; s += g.c;
      for (var j = 0; j < g.p.length; j++) { var q = f(g.p[j][0], g.p[j][1]); s += (j ? " " : "") + q[0].toFixed(2) + " " + q[1].toFixed(2); }
    }
    return s;
  }

  /* ---------- màn xuất hiện: stage bung ra, tiêu đề đập xuống, bảng 4/4 nảy lên, Navi mọc ra, thẻ đồng đội trồi lên ---------- */
  // mốc thời gian (giây)
  var T = { title: 0.05, box: 0.22, naviL: 0.42, naviR: 0.5, mem: 0.5, sheen: 1.2 };
  var NAVI_DUR = 0.45;
  function $(id) { return document.getElementById(id); }
  function scaleAt(cx, cy, sx, sy, extra) {
    return "translate(" + cx + " " + cy + ") " + (extra || "") + " scale(" + sx.toFixed(4) + " " + sy.toFixed(4) + ") translate(" + (-cx) + " " + (-cy) + ")";
  }
  function setOp(e, o) { if (o >= 1) e.removeAttribute("opacity"); else e.setAttribute("opacity", Math.max(0, o).toFixed(3)); }
  var shadows = [document.getElementById("shL"), document.getElementById("shR")];
  var titleG = $("titleG"), boxG = $("boxG"), shakeG = $("shake");
  var naviG = [$("naviL"), $("naviR")], mems = document.querySelectorAll(".mem");
  var FOOT = [[121, 150.5], [319, 150]];          // điểm chân của 2 Navi: mọc ra từ đây
  var MEM_C = [[220.5, 237], [220.5, 351], [220.5, 465], [220.5, 579]];
  // rung khung rất nhẹ đúng nhịp bảng 4/4 chạm
  var HITS = [[0.43, 1.2]];

  function drawIntro(t) {
    // tiêu đề: hơi to -> hạ xuống, lún nhẹ rồi về
    var u = clamp((t - T.title) / 0.38, 0, 1);
    var s = key(u, [[0, 1.45], [0.6, 0.97], [1, 1]]);
    titleG.setAttribute("transform", scaleAt(220.5, 52, s, s));
    setOp(titleG, key(u, [[0, 0], [0.35, 1]]));

    // bảng 4/4: nảy từ 0 lên quá cỡ, xoay nhẹ rồi khoá lại
    u = clamp((t - T.box) / 0.45, 0, 1);
    s = key(u, [[0, 0.3], [0.5, 1.1], [0.78, 0.98], [1, 1]]);
    var r = key(u, [[0, -6], [0.5, 1.5], [1, 0]]);
    boxG.setAttribute("transform", scaleAt(220.5, 121, s, s, "rotate(" + r.toFixed(2) + ")"));
    setOp(boxG, key(u, [[0, 0], [0.3, 1]]));

    // Navi mọc ra từ chân: vươn cao, bè ra khi đáp, rồi về dáng
    ["naviL", "naviR"].forEach(function (k, i) {
      var v = clamp((t - T[k]) / NAVI_DUR, 0, 1);
      var sy = key(v, [[0, 0], [0.5, 1.12], [0.75, 0.94], [1, 1]]);
      var sx = key(v, [[0, 0], [0.5, 0.92], [0.75, 1.05], [1, 1]]);
      naviG[i].setAttribute("transform", scaleAt(FOOT[i][0], FOOT[i][1], sx, sy));
      shadows[i].style.opacity = key(v, [[0, 0], [0.5, 1]]);
    });

    // 4 thẻ đồng đội: trồi lên lần lượt, cùng kiểu nảy
    mems.forEach(function (m, i) {
      var v = clamp((t - T.mem - i * 0.08) / 0.45, 0, 1);
      var ty = key(v, [[0, 18], [0.6, -2], [1, 0]]), sc = key(v, [[0, 0.94], [0.6, 1.01], [1, 1]]);
      m.setAttribute("transform", "translate(0 " + ty.toFixed(2) + ") " + scaleAt(MEM_C[i][0], MEM_C[i][1], sc, sc));
      setOp(m, key(v, [[0, 0], [0.4, 1]]));
    });

    // rung khung
    var dx = 0, dy = 0;
    HITS.forEach(function (h) {
      var d = t - h[0]; if (d < 0 || d > 0.35) return;
      var a = h[1] * Math.exp(-d * 14);
      dy += a * sin(d * 70); dx += a * 0.5 * cos(d * 55);
    });
    if (dx || dy) shakeG.setAttribute("transform", "translate(" + dx.toFixed(2) + " " + dy.toFixed(2) + ")");
    else shakeG.removeAttribute("transform");
  }

  /* ---------- vệt sáng bảng 4/4: overlay, quét 1 chiều, mỗi 2,3s một lần ---------- */
  var sheen = document.getElementById("sheen");
  var BOX_L = 168.5, BOX_W = 104;
  function drawSheen(t) {
    t -= T.sheen;
    if (t < 0) { sheen.setAttribute("transform", "translate(-200 0)"); return; }
    var u = clamp((t % 2.3) / 0.75, 0, 1);            // 0.75s quét, nghỉ tới hết 2,3s
    var x = BOX_L - 40 + (BOX_W + 80) * smooth(u);    // từ ngoài mép trái ra ngoài mép phải
    sheen.setAttribute("transform", "translate(" + x.toFixed(2) + " 0) rotate(18 0 121)");
  }

  /* ---------- rig hai Navi ---------- */
  // toạ độ trong khung của từng Navi: chân đế, chiều cao thân, trục giữa, vai, mắt, miệng, chân
  var RIG = {
    L: { base: 71.5, H: 62, cx: 44, armA: [63, 48], ampA: 1, wing: [13, 62], armB: null,
         eye1: [47.8, 39.2], eye2: [52.8, 39.2], mouth: [47, 46], footL: [30, 72], footR: [57, 72], phase: 0 },
    R: { base: 62, H: 60, cx: 48, armA: [66, 23], ampA: 0.55, wing: null, armB: [35, 35],
         eye1: [37.5, 28.8], eye2: [32.1, 28.7], mouth: [36, 36], footL: [35, 62], footR: [51, 62], phase: 0.5 }
  };
  var PERIOD = 1.1, LAG = 0.07;   // tay trễ theo thân một chút

  function pose(t, cfg) {
    var c = t / PERIOD + cfg.phase, n = Math.floor(c), u = c - n;
    var ca = (t - LAG) / PERIOD + cfg.phase, ua = ca - Math.floor(ca);
    var side = n % 2 ? 1 : -1;
    var sy = key(u, [[0, 1], [0.16, 0.92], [0.3, 1.07], [0.48, 1.01], [0.7, 0.93], [0.82, 1.025], [0.93, 0.996], [1, 1]]);
    return {
      lift: key(u, [[0, 0], [0.16, 0], [0.33, -6.5], [0.48, -9], [0.62, -4], [0.7, 0], [1, 0]]),
      sy: sy, sx: 1 + (1 - sy) * 0.6,
      bend: side * key(u, [[0, 0], [0.16, -0.012], [0.48, 0.035], [0.72, -0.015], [1, 0]]),
      armA: key(ua, [[0, 0], [0.16, 7], [0.46, -16], [0.72, 6], [0.88, -1.5], [1, 0]]),
      armB: key(ua, [[0, 0], [0.16, -6], [0.46, 14], [0.72, -5], [0.88, 1], [1, 0]]),
      mouth: key(u, [[0.12, 1], [0.24, 0.94], [0.44, 1.22], [0.62, 1.08], [0.8, 1]]),
      blink: n % 2 ? 1 : key(u, [[0.6, 1], [0.67, 0.22], [0.78, 0.22], [0.88, 1]]),
      tuck: key(u, [[0.26, 0], [0.42, 11], [0.58, 9], [0.7, 0]])
    };
  }

  function deformer(b, p) {
    return function (x, y) {
      var h = clamp((b.base - y) / b.H, -0.2, 1.5);
      var sx = p.sx + (p.sx - 1) * 0.5 * (1 - h);      // nhún thì phần dưới bè ra nhiều nhất
      return [b.cx + (x - b.cx) * sx + p.bend * b.H * h * h, b.base - (b.base - y) * p.sy + p.lift];
    };
  }
  // xoay mềm: sát vai không xoay, ra tới ~70% cánh tay thì xoay đủ, nên vai không bị hở
  function bendArm(x, y, pv, ang, L) {
    var w = smooth(clamp((Math.hypot(x - pv[0], y - pv[1]) - 0.12 * L) / (0.58 * L), 0, 1));
    return rot(x, y, pv[0], pv[1], ang * w);
  }
  // tay nhỏ dính liền thân của Navi trái: điểm càng ra mép trái càng xoay theo
  function bendWing(x, y, pv, ang) {
    var w = smooth(clamp((pv[0] + 1 - x) / 12, 0, 1)) * smooth(clamp((y - 40) / 12, 0, 1));
    return rot(x, y, pv[0], pv[1], ang * w);
  }

  var rigs = [];
  document.querySelectorAll("[data-navi]").forEach(function (root) {
    var cfg = RIG[root.dataset.navi], items = [], reach = { armA: 0, armB: 0 };
    root.querySelectorAll("[data-p]").forEach(function (el) {
      var role = el.dataset.p, it = { el: el, role: role };
      if (el.tagName === "path") it.segs = parse(el.getAttribute("d"));
      else {
        // chấm tròn / elip: chỉ dời theo tâm, giữ nguyên transform gốc
        var m = el.transform.baseVal.consolidate(), cx = +el.getAttribute("cx"), cy = +el.getAttribute("cy");
        it.base = el.getAttribute("transform") || "";
        it.c = m ? [m.matrix.a * cx + m.matrix.c * cy + m.matrix.e, m.matrix.b * cx + m.matrix.d * cy + m.matrix.f] : [cx, cy];
      }
      if ((role === "armA" || role === "armB") && it.segs) {
        var pv = cfg[role];
        it.segs.forEach(function (g) { g.p.forEach(function (q) { reach[role] = Math.max(reach[role], Math.hypot(q[0] - pv[0], q[1] - pv[1])); }); });
      }
      items.push(it);
    });
    rigs.push({ cfg: cfg, items: items, reach: reach });
  });

  function mapper(r, it, p) {
    var b = r.cfg, D = deformer(b, p), role = it.role, pre = null;
    if (role === "armA") { var a = p.armA * b.ampA, L = r.reach.armA; pre = function (x, y) { return bendArm(x, y, b.armA, a, L); }; }
    else if (role === "armB") { var a2 = p.armB, L2 = r.reach.armB; pre = function (x, y) { return bendArm(x, y, b.armB, a2, L2); }; }
    else if (role === "body" && b.wing) { var aw = p.armB; pre = function (x, y) { return bendWing(x, y, b.wing, aw); }; }
    else if (role === "eye1" || role === "eye2") { var e = b[role], k = p.blink; pre = function (x, y) { return [x, e[1] + (y - e[1]) * k]; }; }
    else if (role === "mouth") { var mc = b.mouth, s = p.mouth; pre = function (x, y) { return [mc[0] + (x - mc[0]) * (1 + (s - 1) * 0.55), mc[1] + (y - mc[1]) * s]; }; }
    else if (role === "footL" || role === "footR") {
      // chân: dính đất khi đứng, bè ra khi nhún, co lên khi bay
      var fp = b[role], dir = role === "footL" ? -1 : 1, spread = (p.sx - 1) * 12 * dir, tk = -p.tuck * dir;
      return function (x, y) { var q = rot(x, y, fp[0], fp[1] - 6, tk); return [q[0] + spread, q[1] + p.lift]; };
    }
    return pre ? function (x, y) { var q = pre(x, y); return D(q[0], q[1]); } : D;
  }

  function drawNavis(t) {
    rigs.forEach(function (r, i) {
      // chỉ nhảy sau khi đã mọc xong
      var p = pose(Math.max(0, t - T[i ? "naviR" : "naviL"] - NAVI_DUR), r.cfg);
      r.items.forEach(function (it) {
        var f = mapper(r, it, p);
        if (it.segs) it.el.setAttribute("d", write(it.segs, f));
        else { var to = f(it.c[0], it.c[1]); it.el.setAttribute("transform", "translate(" + (to[0] - it.c[0]).toFixed(2) + " " + (to[1] - it.c[1]).toFixed(2) + ") " + it.base); }
      });
      var sh = shadows[i], air = clamp(-p.lift / 9, 0, 1), cx = sh.getAttribute("cx"), cy = sh.getAttribute("cy");
      var s = (1 - 0.3 * air) * (0.92 + 0.08 * p.sx);
      sh.setAttribute("transform", "translate(" + cx + " " + cy + ") scale(" + s.toFixed(3) + " 1) translate(" + (-cx) + " " + (-cy) + ")");
      sh.setAttribute("fill-opacity", (0.4 * (1 - 0.45 * air)).toFixed(3));
    });
  }

  /* ---------- pháo màu (bắn 1 lần): giấy bung ra từ sau bảng 4/4 ---------- */
  var COLORS = ["#FFE500"];   // giấy pháo chỉ một màu vàng
  var seed = 11;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  var FIRE = 0.43, K = 5, G = 600;     // cản lớn: bung rất nhanh rồi khựng lại, giấy lơ lửng trong khung
  var BOX = { x: 172, y: 84, w: 97, h: 74, cx: 220.5, cy: 121 };
  var bits = [];
  var confettiG = document.getElementById("confetti");

  function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var a in attrs) e.setAttribute(a, attrs[a]); parent.appendChild(e); return e; }
  function makeBit(x0, y0, ang, spd, delay) {
    var shape = rnd(), c = COLORS[Math.floor(rnd() * COLORS.length)], e;
    if (shape < 0.45) e = el("rect", { x: -4, y: -6, width: 8, height: 12, rx: 1.2 }, confettiG);
    else if (shape < 0.75) e = el("rect", { x: -2, y: -9, width: 4, height: 18, rx: 2 }, confettiG);
    else if (shape < 0.88) e = el("circle", { r: 3.6 }, confettiG);
    else e = el("path", { d: "M0 -6.5 L1.8 -1.8 L6.5 0 L1.8 1.8 L0 6.5 L-1.8 1.8 L-6.5 0 L-1.8 -1.8Z" }, confettiG);
    e.setAttribute("fill", c); e.setAttribute("opacity", 0);
    bits.push({ el: e, x0: x0, y0: y0, vx: cos(ang) * spd, vy: sin(ang) * spd, delay: delay,
      spin: (rnd() - 0.5) * 1100, rot0: rnd() * 360, flip: 7 + rnd() * 8, wob: 2 + rnd() * 3, wph: rnd() * TAU, life: 2.3 + rnd() * 0.7 });
  }
  function buildConfetti() {
    // mỗi mảnh xuất phát ở một chỗ ngẫu nhiên bên trong bảng (khuất sau bảng),
    // bay toả ra theo hướng từ tâm bảng tới chỗ đó, thiên về phía trên
    for (var i = 0; i < 36; i++) {
      var x = BOX.x + rnd() * BOX.w, y = BOX.y + rnd() * BOX.h;
      var ang = Math.atan2((y - BOX.cy) * 0.6 - 18, x - BOX.cx) + (rnd() - 0.5) * 0.5;
      makeBit(x, y, ang, 620 + rnd() * 260, rnd() * 0.06);
    }
  }
  function drawConfetti(t) {
    var tt = t - FIRE;
    bits.forEach(function (b) {
      var s = tt - b.delay;
      if (s <= 0 || s > b.life) { b.el.setAttribute("opacity", 0); return; }
      var e = 1 - Math.exp(-K * s);
      var x = b.x0 + b.vx / K * e + b.wob * sin(s * 5 + b.wph) * Math.min(1, s);
      var y = b.y0 + b.vy / K * e + G / K * s - G / (K * K) * e;
      var r = b.rot0 + b.spin * s, f = cos(s * b.flip);
      var op = clamp((b.life - s) / 0.5, 0, 1);
      b.el.setAttribute("opacity", op.toFixed(3));
      b.el.setAttribute("transform", "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + r.toFixed(1) + ") scale(1 " + f.toFixed(3) + ")");
    });
  }

  buildConfetti();
  function frame(t) { drawIntro(t); drawSheen(t); drawNavis(t); drawConfetti(t); }
  window.__frame = frame;

  /* ---------- chạy (tua được từng khung để xuất video) ---------- */
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var start = performance.now(), paused = false, pauseAt = 0;
  function loop(now) { if (!paused) frame((now - start) / 1000); requestAnimationFrame(loop); }
  if (reduce) frame(4); else requestAnimationFrame(loop);
  window.__demo = {
    duration: 4600,
    seek: function (ms) { paused = true; pauseAt = performance.now(); start = pauseAt - ms; frame(ms / 1000); },
    play: function () { if (paused) { paused = false; start += performance.now() - pauseAt; } }
  };

  var pauseBtn = document.getElementById("pause"), replayBtn = document.getElementById("replay");
  if (replayBtn) replayBtn.addEventListener("click", function () {
    start = performance.now();
    if (paused) { paused = false; pauseBtn.textContent = "Tạm dừng"; pauseBtn.setAttribute("aria-pressed", "false"); }
    if (reduce) frame(4);
  });
  if (pauseBtn) pauseBtn.addEventListener("click", function () {
    var now = performance.now();
    if (!paused) { paused = true; pauseAt = now; pauseBtn.textContent = "Chạy tiếp"; pauseBtn.setAttribute("aria-pressed", "true"); }
    else { paused = false; start += now - pauseAt; pauseBtn.textContent = "Tạm dừng"; pauseBtn.setAttribute("aria-pressed", "false"); }
  });
})();

/* ---------- helpers ---------- */
var $ = function(s,r){ return (r||document).querySelector(s); };
var view = $('#view');
var toastT;
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},2600); }
function copy(text, done){
  function fallback(){ var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); toast(done); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){toast(done);}, fallback); } else fallback();
}
function closeMenus(except){ document.querySelectorAll('.menu').forEach(function(m){ if(m!==except) m.hidden=true; }); }
document.addEventListener('click', function(e){ if(!e.target.closest('.dd')) closeMenus(); });
// clicks inside a demo iframe don't reach document; the window loses focus instead
window.addEventListener('blur', function(){ setTimeout(function(){ if(document.activeElement && document.activeElement.tagName==='IFRAME') closeMenus(); }, 0); });
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeMenus();
  if(e.key==='/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !ui.preview){ e.preventDefault(); $('#q').focus(); }
});

/* ---------- category manager ---------- */
var CAT = { types:{label:'Loại', one:'loại', field:'type'}, projects:{label:'Dự án', one:'dự án', field:'project'} };
var cm = { tab:'types', editing:null, deleting:null, lastFocus:null };
function countIn(kind, name){ return DEMOS.filter(function(d){ return d[CAT[kind].field]===name; }).length; }
function sameName(a,b){ return a.trim().toLowerCase()===b.trim().toLowerCase(); }
function openCats(kind){
  cm.tab = kind || 'types'; cm.editing=null; cm.deleting=null; cm.lastFocus=document.activeElement;
  $('#cats').hidden=false; document.body.style.overflow='hidden';
  renderCats(); $('#catAdd').focus();
}
function closeCats(){
  $('#cats').hidden=true; document.body.style.overflow='';

}
function afterCatChange(){

}
function renderCats(){
  var kind=cm.tab, c=CAT[kind], list=cats[kind];
  $('#catTabs').innerHTML = ['types','projects'].map(function(k){
    return '<button type="button" role="tab" data-cattab="'+k+'" aria-selected="'+(k===kind)+'">'+CAT[k].label+' <span class="n">'+cats[k].length+'</span></button>';
  }).join('');
  $('#catList').innerHTML = list.map(function(name, i){
    var n=countIn(kind,name), used = n ? n+' demo' : 'Chưa dùng';
    if(cm.editing===name) return '<li class="cat-row editing"><form data-renameform="'+i+'"><input class="cat-input" id="catRename" value="'+esc(name)+'" maxlength="40" aria-label="Tên mới cho '+esc(name)+'">'+

    if(cm.deleting===name){

      return '<li class="cat-row deleting"><div class="cat-confirm"><b>Xoá '+c.one+' “'+esc(name)+'”?</b>'+
        (n ? '<label class="cat-move"><span>'+n+' demo đang dùng sẽ chuyển sang</span><select id="catMoveTo">'+others.map(function(x){return '<option>'+esc(x)+'</option>';}).join('')+'</select></label>'
           : '<span class="cat-note">Không có demo nào dùng '+c.one+' này.</span>')+
        '<div class="cat-actions"><button type="button" class="btn sm" data-catcancel>Huỷ</button><button type="button" class="btn danger sm" data-catconfirm="'+i+'">Xoá</button></div></div></li>';
    }

        '<button type="button" class="ib" data-catdown="'+i+'" title="Xuống dưới" aria-label="Đưa '+esc(name)+' xuống dưới"'+(i===list.length-1?' disabled':'')+'>'+I.down+'</button>'+
        '<button type="button" class="ib" data-catedit="'+i+'" title="Đổi tên" aria-label="Đổi tên '+esc(name)+'">'+I.pen+'</button>'+
        '<button type="button" class="ib del" data-catdel="'+i+'" title="Xoá" aria-label="Xoá '+esc(name)+'"'+(list.length<2?' disabled':'')+'>'+I.trash+'</button>'+
      '</span></li>';
  }).join('');

  if(cm.editing){ var r=$('#catRename'); if(r){ r.focus(); r.select(); } }
  if(cm.deleting){ var cf=$('#catList [data-catconfirm]'); var mv=$('#catMoveTo'); (mv||cf).focus(); }

function catError(el, msg){ el.textContent=msg; el.hidden=false; }
$('#catTabs').addEventListener('click', function(e){ var b=e.target.closest('[data-cattab]'); if(!b) return; cm.tab=b.dataset.cattab; cm.editing=null; cm.deleting=null; renderCats(); });
$('#catList').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  var kind=cm.tab, list=cats[kind], c=CAT[kind];
  if(b.hasAttribute('data-catcancel')){ cm.editing=null; cm.deleting=null; renderCats(); return; }
  if(b.dataset.catedit){ cm.editing=list[+b.dataset.catedit]; cm.deleting=null; renderCats(); return; }
  if(b.dataset.catdel){ cm.deleting=list[+b.dataset.catdel]; cm.editing=null; renderCats(); return; }
  if(b.dataset.catup || b.dataset.catdown){
    var i=+(b.dataset.catup||b.dataset.catdown), j=b.dataset.catup?i-1:i+1;
    var t=list[i]; list[i]=list[j]; list[j]=t; afterCatChange(); renderCats();
    var again=$('#catList [data-cat'+(b.dataset.catup?'up':'down')+'="'+j+'"]'); if(again && !again.disabled) again.focus();
    return;
  }
  if(b.dataset.catconfirm){
    var name=list[+b.dataset.catconfirm], mv=$('#catMoveTo'), to = mv ? mv.value : null;
    DEMOS.forEach(function(d){ if(d[c.field]===name) d[c.field]=to; });
    cats[kind]=list.filter(function(x){return x!==name;});
    if(ui.type===name) ui.type='Tất cả';
    if(ui.project===name) ui.project=null;
    cm.deleting=null; afterCatChange(); renderCats();
    toast('Đã xoá '+c.one+' “'+name+'”'+(to?', demo chuyển sang “'+to+'”':''));
  }
});
$('#catList').addEventListener('submit', function(e){
  e.preventDefault();
  var kind=cm.tab, list=cats[kind], c=CAT[kind], old=cm.editing, nw=$('#catRename').value.trim();
  if(!nw) return catError($('#catRenameErr'), 'Tên không được để trống.');
  var clash=list.filter(function(x){ return x!==old && sameName(x,nw); })[0];
  if(clash) return catError($('#catRenameErr'), 'Đã có '+c.one+' “'+clash+'”.');
  cats[kind]=list.map(function(x){ return x===old?nw:x; });
  DEMOS.forEach(function(d){ if(d[c.field]===old) d[c.field]=nw; });
  if(ui.type===old) ui.type=nw;
  if(ui.project===old) ui.project=nw;
  cm.editing=null; afterCatChange(); renderCats();
  if(old!==nw) toast('Đã đổi “'+old+'” thành “'+nw+'”');
});
$('#catList').addEventListener('keydown', function(e){ if(e.key==='Escape' && (cm.editing||cm.deleting)){ e.stopPropagation(); cm.editing=null; cm.deleting=null; renderCats(); } });
$('#catAddForm').addEventListener('submit', function(e){
  e.preventDefault();
  var kind=cm.tab, c=CAT[kind], inp=$('#catAdd'), nw=inp.value.trim();
  if(!nw) return catError($('#catAddErr'), 'Nhập tên '+c.one+' trước khi thêm.');
  var dup=cats[kind].filter(function(x){ return sameName(x,nw); })[0];
  if(dup) return catError($('#catAddErr'), 'Đã có '+c.one+' “'+dup+'”.');
  cats[kind].push(nw); inp.value=''; afterCatChange(); renderCats(); inp.focus();
  toast('Đã thêm '+c.one+' “'+nw+'”');
});
$('#catAdd').addEventListener('input', function(){ $('#catAddErr').hidden=true; });
$('#cats').addEventListener('click', function(e){ if(e.target.id==='cats' || e.target.closest('[data-catclose]')) closeCats(); });
$('#cats').addEventListener('keydown', function(e){
  if(e.key==='Escape'){ e.stopPropagation(); closeCats(); return; }
  if(e.key!=='Tab') return; // keep focus inside the dialog
  var f=[].filter.call($('#cats .sheet').querySelectorAll('button,input,select'), function(x){ return !x.disabled && x.offsetParent; });
  if(!f.length) return;
  if(e.shiftKey && document.activeElement===f[0]){ e.preventDefault(); f[f.length-1].focus(); }
  else if(!e.shiftKey && document.activeElement===f[f.length-1]){ e.preventDefault(); f[0].focus(); }
});

  $('#editForm').addEventListener('submit', function(e){
    e.preventDefault();
    var tSel=$('#fType').value, type = tSel==='__new' ? $('#fTypeNew').value.trim() : tSel;
    var v={ title:$('#fTitle').value.trim(), desc:$('#fDesc').value.trim(), type:type, project:$('#fProject').value };
    var missing=[]; if(!v.title) missing.push('tên'); if(!v.type) missing.push('loại'); if(!v.project) missing.push('dự án');
    if(missing.length){ var er=$('#fErr'); er.textContent='Cần nhập '+missing.join(', ')+'.'; er.hidden=false; return; }
    var known=cats.types.filter(function(x){ return sameName(x,v.type); })[0];
    if(known) v.type=known; else cats.types.push(v.type);
    EDITABLE.forEach(function(k){ d[k]=v[k]; });
    saveAllEdits();
    ui.editing=false; renderRail(); renderHead(d);
    var fr=view.querySelector('.stage iframe'); if(fr) fr.title=d.title;
    toast('Đã lưu thông tin demo');
  });
}

/* ---------- export (MP4 / WebM / GIF / WebP / Lottie) ---------- */
var FORMATS = {
  mp4:    { label:'MP4',  sub:'Video', alpha:false, loop:false, mbps:0.30, hint:'Gửi người xem, chèn slide, mạng xã hội.' },
  webm:   { label:'WebM', sub:'Video trong suốt', alpha:true, loop:false, mbps:0.40, hint:'Gắn lên web, đè lên nền khác bằng thẻ <video>.' },
  gif:    { label:'GIF',  sub:'Ảnh động', alpha:true, loop:true, mbps:2.6, hint:'Dán nhanh vào Slack, Jira. Tối đa 256 màu, file nặng.' },
  webp:   { label:'WebP', sub:'Ảnh động nhẹ', alpha:true, loop:true, mbps:0.9, hint:'Nhẹ và đẹp hơn GIF, dùng trên web, Figma, Slack.' },
  lottie: { label:'Lottie', sub:'Vector cho app', alpha:false, loop:true, hint:'File vector nhẹ cho web, iOS, Android, Flutter. Nền luôn trong suốt.' }
};
var STATUS = { ok:'Xuất được', warn:'Xuất được, có lưu ý', no:'Chưa xuất được' };
var SIZES = [['1280x720','1280 × 720'],['1920x1080','1920 × 1080'],['1080x1080','1080 × 1080 (vuông)'],['1080x1920','1080 × 1920 (dọc)'],['800x450','800 × 450 (nhẹ)']];
var ex = { fmt:'mp4', size:'1920x1080', fps:30, from:0, to:null, loop:true, alpha:false, lottieFile:'json' };
// can this demo be exported to this format, and what gets lost?
function compat(d, fmt){
  if(fmt==='lottie') return d.lottie || { status:'no', notes:['Chưa đánh giá demo này cho Lottie.'] };
  if(d.interactive) return { status:'no', notes:[d.interactive] };
  if(fmt==='gif' && d.gifNote) return { status:'warn', notes:[d.gifNote] };
  return { status:'ok', notes:[] };
}
function demoSecs(d){ return (d.duration || 2000)/1000; }
function exportPanel(d){
  var dur=demoSecs(d), max = d.loop ? dur*4 : dur;
  if(ex.to==null || +ex.to>max || +ex.to<=0) ex.to=dur;
  if(+ex.from>=+ex.to) ex.from=0;
  var f=FORMATS[ex.fmt], c=compat(d, ex.fmt), lot=ex.fmt==='lottie', blocked=c.status==='no';
  var fpsOpts = lot ? [24,30,60] : [30,60];
  if(fpsOpts.indexOf(+ex.fps)<0) ex.fps=30;
  return '<form class="ex" data-exform novalidate>'+
    '<div class="ex-row"><span class="ex-l">Định dạng</span><div class="ex-fmts" role="radiogroup" aria-label="Định dạng">'+
      Object.keys(FORMATS).map(function(k){
        var x=FORMATS[k], st=compat(d,k).status;
        return '<button type="button" role="radio" aria-checked="'+(ex.fmt===k)+'" data-fmt="'+k+'" title="'+STATUS[st]+'">'+
          '<b><i class="dot '+st+'" aria-label="'+STATUS[st]+'"></i>'+x.label+'</b><small>'+x.sub+'</small></button>';
      }).join('')+
    '</div><p class="ex-hint">'+esc(f.hint)+'</p></div>'+
    (c.status!=='ok' ? '<div class="ex-compat '+c.status+'"><b>'+STATUS[c.status]+'</b><ul>'+c.notes.map(function(n){ return '<li>'+esc(n)+'</li>'; }).join('')+'</ul></div>' : '')+
    (blocked ? '' :
    '<div class="ex-grid">'+
      '<label class="ex-row"><span class="ex-l">'+(lot?'Khung vẽ (artboard)':'Kích thước')+'</span><select id="exSize">'+SIZES.map(function(s){ return '<option value="'+s[0]+'"'+(ex.size===s[0]?' selected':'')+'>'+s[1]+'</option>'; }).join('')+'</select></label>'+
      '<label class="ex-row"><span class="ex-l">Khung hình / giây</span><select id="exFps">'+fpsOpts.map(function(v){ return '<option value="'+v+'"'+(ex.fps==v?' selected':'')+'>'+v+' fps</option>'; }).join('')+'</select></label>'+
    '</div>'+
    '<div class="ex-row"><span class="ex-l">Đoạn xuất (giây) · demo dài '+dur+'s'+(d.loop?', lặp vô hạn':'')+'</span>'+
      '<div class="ex-range"><input id="exFrom" type="number" min="0" max="'+dur+'" step="0.1" value="'+ex.from+'" aria-label="Từ giây"><span>→</span><input id="exTo" type="number" min="0.1" max="'+max+'" step="0.1" value="'+ex.to+'" aria-label="Đến giây"></div></div>'+
    (lot ? '<div class="ex-row"><span class="ex-l">Loại file</span><div class="ex-seg" role="radiogroup" aria-label="Loại file Lottie">'+
        '<button type="button" role="radio" data-lf="json" aria-checked="'+(ex.lottieFile==='json')+'">.json<small>Dùng được mọi nơi</small></button>'+
        '<button type="button" role="radio" data-lf="lottie" aria-checked="'+(ex.lottieFile==='lottie')+'">.lottie<small>Bản nén, nhẹ hơn</small></button></div></div>' : '')+
    '<div class="ex-checks">'+
      '<label class="ex-check'+(f.loop?'':' off')+'"><input type="checkbox" id="exLoop"'+(ex.loop?' checked':'')+(f.loop?'':' disabled')+'> Lặp vô hạn</label>'+
      (lot ? '' : '<label class="ex-check'+(f.alpha?'':' off')+'"><input type="checkbox" id="exAlpha"'+(ex.alpha&&f.alpha?' checked':'')+(f.alpha?'':' disabled')+'> Nền trong suốt</label>')+
    '</div>'+
    '<p class="ex-alpha-note" id="exAlphaNote"'+(ex.alpha&&f.alpha&&!lot?'':' hidden')+'>Demo này đang tô nền kín. Nền chỉ trong suốt khi bỏ lớp nền của demo, Claude sẽ bỏ giúp lúc render.</p>'+
    '<p class="ex-est" id="exEst"></p>'+
    '<p class="ex-err" id="exErr" hidden></p>')+
    '<button type="submit" class="btn primary ex-go"'+(blocked?' disabled':'')+'>'+I.film+(blocked?'Chưa xuất được':'Xuất '+f.label+(c.status==='warn'?' (có lưu ý)':''))+'</button>'+
    '<p class="ex-foot">Bản thử: bấm xuất sẽ copy yêu cầu, bạn dán vào chat để Claude render file. Bản thật sẽ tự render và tải về.</p>'+
  '</form>';
}
function exportSpec(d){
  var w=ex.size.split('x');
  return { from:+ex.from, to:+ex.to, w:+w[0], h:+w[1] };
}
function updateEstimate(d){
  var el=view.querySelector('#exEst'); if(!el) return;
  var sp=exportSpec(d), secs=Math.max(0, sp.to-sp.from), f=FORMATS[ex.fmt];
  var frames = Math.round(secs*ex.fps);
  if(ex.fmt==='lottie'){ el.textContent = frames+' khung hình · thường 20–200 KB, tuỳ số hình'; el.classList.remove('warn'); return; }
  var px = (sp.w*sp.h)/(1280*720), mb = f.mbps*secs*px*(ex.fps/30);
  el.textContent = frames+' khung hình · ước tính ~'+(mb<1 ? Math.max(0.1,mb).toFixed(1) : Math.round(mb))+' MB';
  el.classList.toggle('warn', mb>15);
  if(mb>15) el.textContent += ' · khá nặng, nên giảm kích thước hoặc fps';
}
function bindExport(d){
  var form=view.querySelector('[data-exform]'); if(!form) return;
  var reopen=function(){ renderExport(d); };
  form.querySelectorAll('[data-fmt]').forEach(function(b){ b.onclick=function(e){
    e.stopPropagation(); // the panel re-renders, so the click target leaves the DOM
    ex.fmt=b.dataset.fmt;
    if(ex.fmt==='gif' && ex.size!=='800x450'){ ex.size='800x450'; ex.fps=30; } // GIF gets heavy fast
    reopen();
  }; });
  form.querySelectorAll('[data-lf]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); ex.lottieFile=b.dataset.lf; reopen(); }; });
  ['exSize','exFps','exFrom','exTo','exLoop','exAlpha'].forEach(function(id){
    var el=form.querySelector('#'+id); if(!el) return;
    el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'?'change':'input', function(){
      var v=function(i){ return form.querySelector('#'+i); };
      ex.size=v('exSize').value; ex.fps=+v('exFps').value; ex.from=v('exFrom').value; ex.to=v('exTo').value;
      ex.loop=v('exLoop').checked; if(v('exAlpha')) ex.alpha=v('exAlpha').checked;
      var an=v('exAlphaNote'); if(an) an.hidden=!(ex.alpha && FORMATS[ex.fmt].alpha);
      v('exErr').hidden=true; updateEstimate(d);
    });
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var c=compat(d, ex.fmt); if(c.status==='no') return;
    var sp=exportSpec(d), f=FORMATS[ex.fmt], err=form.querySelector('#exErr');
    if(!(sp.to>sp.from)){ err.textContent='Giây kết thúc phải lớn hơn giây bắt đầu.'; err.hidden=false; return; }
    if(sp.from<0){ err.textContent='Giây bắt đầu không được âm.'; err.hidden=false; return; }
    var parts=[ex.fmt==='lottie' ? 'Lottie (.'+ex.lottieFile+')' : f.label, sp.w+'×'+sp.h, ex.fps+'fps', sp.from+'–'+sp.to+'s'];
    if(f.loop) parts.push(ex.loop?'lặp':'không lặp');
    if(f.alpha && ex.alpha) parts.push('nền trong suốt');
    var msg='Xuất demo “'+d.title+'” ('+d.slug+') → '+parts.join(' · ');
    if(c.status==='warn') msg+='\nLưu ý đã biết: '+c.notes.join(' ');
    copy(msg, 'Đã copy yêu cầu xuất. Dán vào chat để Claude render');
    closeMenus();
  });
  updateEstimate(d);
}
function renderExport(d){
  var m=view.querySelector('[data-menu="export"]'); if(!m) return;
  m.innerHTML=exportPanel(d); bindExport(d);
}

function bindDetail(d){
  bindExport(d);
  view.querySelectorAll('[data-tab]').forEach(function(b){ b.onclick=function(){ ui.tab=b.dataset.tab; renderDetail(d); }; });
  view.querySelectorAll('[data-vp]').forEach(function(b){ if(b.tagName==='BUTTON') b.onclick=function(){ ui.vp=b.dataset.vp; var st=view.querySelector('.stage'); st.dataset.vp=ui.vp; view.querySelectorAll('button[data-vp]').forEach(function(x){x.setAttribute('aria-pressed', x===b);}); st.querySelector('.vp-label').textContent=({desktop:'Desktop',tablet:'Tablet · 768px',mobile:'Mobile · 375px'})[ui.vp]; }; });
  var rp=view.querySelector('[data-replay]'); if(rp) rp.onclick=function(){ view.querySelector('.stage iframe').srcdoc = srcdoc(d); };
  view.querySelectorAll('[data-file]').forEach(function(b){ b.onclick=function(){ ui.file=b.dataset.file; renderDetail(d); }; });
  var cf=view.querySelector('[data-copyfile]'); if(cf) cf.onclick=function(){ var f=files(d).filter(function(f){return f[0]===ui.file;})[0]; copy(f[2], 'Đã copy '+f[1]); };
  view.querySelectorAll('[data-open]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); var m=b.parentNode.querySelector('.menu'); closeMenus(m); m.hidden=!m.hidden; }; });
  view.querySelectorAll('[data-ai]').forEach(function(b){ b.onclick=function(){
    closeMenus();
    if(b.dataset.ai==='prompt') copy(aiPrompt(d), 'Đã copy prompt. Dán vào ChatGPT, Claude hoặc Cursor');
    if(b.dataset.ai==='single') copy(single(d), 'Đã copy code 1 file');
    if(b.dataset.ai==='md') toast('Bản thử chưa tải file được. Bản thật sẽ tải '+d.slug+'.md');
  }; });
  view.querySelectorAll('[data-dl]').forEach(function(b){ b.onclick=function(){
    closeMenus();
    toast(b.dataset.dl==='zip' ? 'Bản thử chưa tải file được. Bản thật sẽ tải '+d.slug+'.zip' : 'Bản thử chưa tải file được. Bản thật sẽ tải '+d.slug+'.html');
  }; });
  // update share controls in place so the running demo is not reloaded
  function syncShare(){
    var s=shareOf(d.slug), inp=$('#shareLink');
    view.querySelector('[data-toggle]').setAttribute('aria-checked', s.on);
    inp.value = s.on ? shareUrl(d.slug) : 'Đang riêng tư, chưa có link';
    inp.disabled = !s.on;
    view.querySelector('[data-copylink]').disabled = !s.on;
    var st=view.querySelector('.d-meta .only-owner'); if(st) st.innerHTML = statusHtml(d.slug);
  }
  var tg=view.querySelector('[data-toggle]'); if(tg) tg.onclick=function(e){
    e.stopPropagation();
    var s=shareOf(d.slug);
    if(s.on){ share[d.slug]={on:false, token:null}; toast('Đã khoá. Link cũ không mở được nữa'); }
    else { share[d.slug]={on:true, token:token()}; toast('Đã bật chia sẻ. Copy link để gửi'); }
    save('tvcl-share', share); syncShare();
  };
  var cl=view.querySelector('[data-copylink]'); if(cl) cl.onclick=function(){ copy($('#shareLink').value, 'Đã copy link chia sẻ'); };
  var rg=view.querySelector('[data-regen]'); if(rg) rg.onclick=function(e){
    e.stopPropagation(); share[d.slug]={on:true, token:token()}; save('tvcl-share', share);
    syncShare(); toast('Đã tạo link mới. Link cũ hết hiệu lực');
  };
  var ar=view.querySelector('[data-asrecipient]'); if(ar) ar.onclick=function(){ closeMenus(); setPreview(true); };
}

/* ---------- recipient view ---------- */
function renderLocked(){
  view.innerHTML='<div class="locked"><div class="ico">'+I.lock+'</div><h2>Demo này không còn được chia sẻ</h2><p>Người gửi đã khoá link. Nhờ họ bật lại hoặc gửi link mới.</p></div>';
}
function setPreview(on){
  ui.preview=on;
  document.body.classList.toggle('share', on);
  $('#band').hidden=!on; $('#sharedBy').hidden=!on;
  if(!on){ render(); return; }
  ui.tab='preview'; ui.editing=false;
  var d=find(ui.slug);
  if(ui.recipient){ $('#band').hidden=true; renderDetail(d); }
  else if(shareOf(d.slug).on) renderDetail(d); else renderLocked();
  window.scrollTo(0,0);
}
$('#exitShare').onclick=function(){ setPreview(false); };

/* ---------- routing ---------- */
function openDemo(slug){ ui.slug=slug; ui.tab='preview'; ui.file='html'; ui.editing=false; go('detail'); }
function go(v){
  ui.view=v; render(); window.scrollTo(0,0);
  try{ if(v==='detail') history.pushState(null,'','#'+ui.slug); else history.replaceState(null,'',location.pathname+location.search); }catch(e){}
}
function render(){ renderRail(); if(ui.view==='detail' && find(ui.slug)) renderDetail(find(ui.slug)); else { ui.view='gallery'; renderGallery(); } }
$('#home').onclick=function(){ if(ui.preview) return; ui.type='Tất cả'; ui.project=null; ui.q=''; $('#q').value=''; go('gallery'); };
$('#q').addEventListener('input', function(e){ ui.q=e.target.value; if(ui.view!=='gallery'){ ui.view='gallery'; } renderRail(); renderGallery(); });

function fromHash(){
  var h=(location.hash||'').slice(1);
  if(h && find(h)){ ui.slug=h; ui.view='detail'; } else ui.view='gallery';
}
window.addEventListener('hashchange', function(){ if(ui.preview) return; fromHash(); render(); });
var shared=new URLSearchParams(location.search).get('s');
if(shared && find(shared)){ ui.recipient=true; ui.slug=shared; ui.view='detail'; renderRail(); setPreview(true); }
else { fromHash(); render(); }
</script>
