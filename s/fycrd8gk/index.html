input:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:16px 0 20px;font-size:14px;color:var(--fg)}
button{width:100%;height:44px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:700 15px inherit;cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}.err{color:#FF7A6B;font-size:13px;min-height:20px;margin:10px 0 0}</style></head><body>

function idb(){return new Promise(function(ok,no){var r=indexedDB.open('tvil',1);r.onupgradeneeded=function(){r.result.createObjectStore('k')};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})}
function kget(){return idb().then(function(d){return new Promise(function(ok){var q=d.transaction('k').objectStore('k').get('ck');q.onsuccess=function(){ok(q.result||null)};q.onerror=function(){ok(null)}})}).catch(function(){return null})}
function kput(v){return idb().then(function(d){return new Promise(function(ok){var t=d.transaction('k','readwrite');t.objectStore('k').put(v,'ck');t.oncomplete=ok;t.onerror=ok})}).catch(function(){})}
function kdel(){return idb().then(function(d){return new Promise(function(ok){var t=d.transaction('k','readwrite');t.objectStore('k').delete('ck');t.oncomplete=ok;t.onerror=ok})}).catch(function(){})}
function ub(s){return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),function(c){return c.charCodeAt(0)})}
function open_(key,box){return crypto.subtle.decrypt({name:'AES-GCM',iv:ub(box.iv)},key,ub(box.ct)).then(function(b){return new TextDecoder().decode(b)})}
function show(html){document.open();document.write(html);document.close()}
